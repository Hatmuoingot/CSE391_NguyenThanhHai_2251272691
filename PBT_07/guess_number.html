<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mini Game: Đoán số</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body class="bg-light p-5 text-center">

    <div class="container" style="max-width: 500px;">
        <div class="card card-body shadow-sm py-4">
            <h3 class="fw-bold mb-3 text-primary">🎲 Game Đoán Số (1-100)</h3>
            <p class="text-muted small mb-4">Bạn có tối đa 7 lượt để tìm ra con số bí mật của máy tính.</p>
            
            <button class="btn btn-dark btn-lg w-100 fw-bold" onclick="playGame()">Bắt đầu chơi</button>
        </div>
    </div>

    <script src="./guess.js"></script>
</body>
</html>
