<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CSS Transition & Animation Playground</title>
    <link rel="stylesheet" href="./animations.css">
</head>
<body class="p-5">

    <div class="animation-container">
        <h2>Kiểm Thử 5 Hiệu Ứng CSS Chuyên Nghiệp</h2>

        <div class="test-wrapper fade-in">
            
            <div class="product-card">
                <div class="img-zoom-container">
                    <img src="https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500" alt="Lab Device">
                </div>
                <div class="card-content">
                    <h3>Hệ Thống Labs Thử Nghiệm Tường Lửa</h3>
                    <p>Cấu hình chuyên dụng tối ưu phân luồng gói tin bảo mật.</p>
                    
                    <button class="btn-buy">Mua ngay</button>

            </div>

            <div class="spinner-box">
                <p>Trạng thái tải log bảo mật...</p>

        </div>
