<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>B4 - Multi-API Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0">📊 Hệ Thống Dashboard Tổng Hợp</h4>
            <button id="refreshBtn" class="btn btn-sm btn-dark fw-bold">Refresh All</button>
        </div>

        <p id="fetchTime" class="small text-muted italic mb-3">Thời gian phản hồi: 0 ms</p>

        <div class="card card-body mb-3 border-0 shadow-sm">
            <h6 class="fw-bold text-secondary mb-2">📌 Widget 1: Bài viết tiêu biểu (API 1)</h6>
            <div id="widget1" class="small text-dark"></div>
        </div>

        <div class="card card-body mb-3 border-0 shadow-sm">
            <h6 class="fw-bold text-secondary mb-2">⚠️ Widget 2: Trạm cấp lỗi hệ thống (API 2)</h6>
            <div id="widget2" class="small text-dark"></div>
        </div>
    </div>
    <script src="./app_d.js"></script>
</body>
</html>
