<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>B2 - User Directory CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold m-0">👥 Danh Sách Thành Viên</h4>
            <button id="loadBtn" class="btn btn-primary btn-sm fw-bold">Tải danh sách API</button>
        </div>

        <form id="userForm" class="card card-body mb-3 border-0 shadow-sm input-group">
            <input type="text" id="userNameInput" class="form-control" placeholder="Nhập họ và tên thành viên mới..." required>
            <button type="submit" class="btn btn-dark">Thêm mới</button>
        </form>

        <div id="alertContainer"></div>

        <ul id="userList" class="list-group shadow-sm"></ul>
    </div>
    <script src="./app_ud.js"></script>
</body>
</html>
