<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài B4 - Keyboard Navigation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light p-5 text-center">
    <div class="container" style="max-width: 500px;">
        <div class="card card-body shadow-sm">
            <h5 class="fw-bold text-primary mb-3">Bài B4: Quản Lý Phím Cứng Shortcuts</h5>
            <p class="text-muted small mb-4">Nhấn phím <strong>Escape (ESC)</strong> trên bàn phím máy tính của bạn để đóng nhanh hộp thông báo khẩn cấp dưới đây.</p>
            
            <button class="btn btn-warning fw-bold mb-3 w-100" id="triggerAlertBtn">Hiện hộp thông báo khẩn</button>
            
            <div id="secureAlertBox" class="alert alert-danger d-none fw-bold shadow-sm" role="alert">
                🚨 CẢNH BÁO: Phát hiện truy cập trái phép! (Bấm phím ESC để tắt nhanh)
            </div>
        </div>
    </div>
    <script src="./app_ka.js"></script>
</body>
</html>
