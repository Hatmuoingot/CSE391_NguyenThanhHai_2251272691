<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài B3 - Form Validator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 420px;">
        <div class="card card-body shadow-sm border-0">
            <h5 class="fw-bold mb-3 text-center text-secondary">Đăng Ký Tài Khoản</h5>
            <form id="authForm">
                
                <div class="mb-3">
                    <label class="form-label small fw-bold">ĐỊA CHỈ EMAIL</label>
                    <input type="text" id="emailInput" class="form-control" placeholder="hai@tlu.edu.vn">
                    <div id="emailErrDisplay" class="text-danger small mt-1 fw-semibold"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">MẬT KHẨU</label>
                    <input type="password" id="passwordInput" class="form-control" placeholder="Tối thiểu từ 8 ký tự...">
                    <div id="passwordStrengthText" class="small mt-1 fw-bold"></div>
                </div>

                <button type="submit" id="submitFormBtn" class="btn btn-primary w-100 fw-bold" disabled>Gửi thông tin</button>
            </form>
        </div>
    </div>
    <script src="./app_fv.js"></script>
</body>
</html>
