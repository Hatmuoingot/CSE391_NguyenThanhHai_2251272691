<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài B2 - Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light p-4" id="mainBody">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0">🛍️ Cyber Market</h3>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-dark" id="darkToggle">Giao diện: Tối 🌓</button>
                <span class="btn btn-dark btn-sm position-relative">
                    🛒 Giỏ hàng <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="badgeCounter">0</span>
                </span>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <input type="text" id="liveSearch" class="form-control" placeholder="Gõ tìm kiếm tên sản phẩm thời gian thực...">
            </div>
            <div class="col-md-4">
                <select id="catSelect" class="form-select">
                    <option value="all">Tất cả danh mục</option>
                    <option value="phone">Điện thoại</option>
                    <option value="laptop">Máy tính xách tay</option>
                </select>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-3" id="catalogGrid"></div>
    </div>
    <script src="./app_pc.js"></script>
</body>
</html>
